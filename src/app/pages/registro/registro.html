<div class="content-layout">
    
    <section class="form-section">
      <div class="card">
        <h2>Registrar Nuevo Producto</h2>
        <p class="card-instruction">Ingresa los detalles del cosmético para guardarlo en la base de datos.</p>
        
        <form class="makeup-form">
          
          <div class="form-group">
            <label for="productName">Nombre del Producto</label>
            <input type="text" id="productName" name="productName" placeholder="Ej. Labial Matte Longwear" required>
          </div>

          <div class="form-group">
            <label for="brand">Marca</label>
            <input type="text" id="brand" name="brand" placeholder="Ej. Ruby Rose, Bissú, Maybelline" required>
          </div>

          <div class="form-group">
            <label for="category">Categoría</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Selecciona una categoría...</option>
              <option value="rostro">Rostro (Base, Corrector, Polvo)</option>
              <option value="labios">Labios (Labial, Delineador, Gloss)</option>
              <option value="ojos">Ojos (Paleta de sombras, Máscara, Cejas)</option>
              <option value="skincare">Cuidado Facial / Preparación</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group col">
              <label for="price">Precio ($)</label>
              <input type="number" id="price" name="price" min="0" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group col">
              <label for="stock">Cantidad en Stock</label>
              <input type="number" id="stock" name="stock" min="0" placeholder="0" required>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <span>Guardar en Laravel</span>
          </button>
          
        </form>
      </div>
    </section>

  </div>
