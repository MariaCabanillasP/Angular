<div class="form-container">
  <h2 class="form-title">Registro de Cosméticos</h2>
  
  <form [formGroup]="formProducto" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label class="form-label">Nombre del Producto:</label>
      <input type="text" formControlName="name" placeholder="Ej: Labial Matte" class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Marca:</label>
      <input type="text" formControlName="brand" placeholder="Ej: Bissú" class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Categoría:</label>
      <select formControlName="category" class="form-select">
        <option value="">-- Selecciona una categoría --</option>
        <option value="Labios">Labios</option>
        <option value="Rostro">Rostro</option>
        <option value="Ojos">Ojos</option>
        <option value="Skincare">Skincare</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Precio ($):</label>
      <input type="number" formControlName="price" min="0" step="0.01" class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Cantidad en Stock:</label>
      <input type="number" formControlName="stock" min="0" class="form-input">
    </div>

    <button type="submit" class="btn-submit">
      Guardar Cosmético
    </button>

  </form>
</div>
